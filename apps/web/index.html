<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="description" content="Agent coworkers for your tickets. Tickets in, verified work out." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zippy" />
    <meta property="og:description" content="Agent coworkers for your tickets. Tickets in, verified work out." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zippy</title>
    <script>
      try {
        var t = localStorage.theme;
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
      try { if (sessionStorage.booted) document.documentElement.classList.add("seen"); } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #fcfcfd; }
      html.dark, html.dark body { background: #151516; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px; background: #fcfcfd; color: #1b1b1f; font: 700 22px/1 system-ui, sans-serif; letter-spacing: -0.02em; animation: boot-show 0s 0.15s backwards; transition: background-color 0.45s ease, opacity 0.3s ease; }
      .dark #boot { background: #151516; color: #f2f2f3; }
      #boot.done { background: transparent; pointer-events: none; }
      #boot img { width: 64px; height: 64px; animation: boot-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both, boot-bob 1.6s ease-in-out 0.5s infinite; filter: drop-shadow(0 6px 18px rgba(94, 106, 210, 0.45)); }
      #boot span { animation: boot-fade 0.5s ease 0.15s both; transition: opacity 0.15s, transform 0.32s; }
      #boot i { display: block; width: 72px; height: 3px; border-radius: 3px; background: rgba(94, 106, 210, 0.2); overflow: hidden; animation: boot-fade 0.5s ease 0.3s both; transition: opacity 0.15s; }
      #boot i::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #5e6ad2; animation: boot-bar 1.1s ease-in-out infinite; }
      #boot.done span, #boot.done i { opacity: 0; transform: translateY(6px); }
      #root > * { animation: root-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      /* Repeat visit this session: no intro, quicker exit. */
      .seen #boot img, .seen #boot span, .seen #boot i { animation: none; }
      .seen #boot img { animation: boot-bob 1.6s ease-in-out infinite; }
      .seen #boot { transition-duration: 0.25s; }
      @keyframes boot-show { from { opacity: 0; } }
      @keyframes root-in { from { opacity: 0; transform: translateY(6px) scale(0.995); } }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.6) rotate(-8deg); } }
      @keyframes boot-bob { 50% { transform: translateY(-5px) scale(1.04); } }
      @keyframes boot-fade { from { opacity: 0; transform: translateY(4px); } }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot *, #boot img, #root > * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <noscript><p style="font:16px system-ui;text-align:center;margin-top:20vh">Zippy needs JavaScript. Enable it and reload.</p></noscript>
    <div id="boot" role="status" aria-label="Loading Zippy"><img src="/favicon.svg" alt="" /><span>Zippy</span><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
