[package]
name = "zippy-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "zippy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] } # unstable: Window::add_child for browser tabs
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
postgresql_embedded = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "sync", "signal", "macros"] }
